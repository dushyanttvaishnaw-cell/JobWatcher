name: Validate sources

on:
  workflow_dispatch:
    inputs:
      prune:
        description: "Comment out sources that fail?"
        type: boolean
        default: true
  push:
    paths: [companies.txt]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every source in companies.txt
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python watcher.py --validate ${{ (github.event_name == 'push' || inputs.prune) && '--prune' || '' }}
      - name: Commit results
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "job-watcher-bot@users.noreply.github.com"
          git add state/validation.md companies.txt
          git diff --cached --quiet || (git commit -q -m "validate sources" && git pull -q --rebase && git push -q)
